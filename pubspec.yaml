name: argos_app
description: ARGOS - Aplicación Flutter
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: ^3.9.2

dependencies:
  flutter:
    sdk: flutter

  design_system:
    path: packages/design_system

  cupertino_icons: ^1.0.8
  flutter_riverpod: ^2.6.1
  riverpod_annotation: ^2.6.1
  go_router: ^14.8.1
  dio: ^5.8.0
  drift: ^2.25.0
  drift_flutter: ^0.2.4
  flutter_secure_storage: ^9.2.4
  fpdart: ^1.1.0
  crypto: ^3.0.6
  path: ^1.9.1
  path_provider: ^2.1.5
  local_auth: ^3.0.1
  uuid: ^4.6.0
  connectivity_plus: ^7.3.2
  package_info_plus: ^9.0.1
  device_info_plus: ^12.4.0
  google_fonts: ^6.2.1
  camera: ">=0.11.2 <0.12.0"
  image: ^4.13.1
  geolocator: ^14.0.1
  url_launcher: ^6.3.2
  firebase_core: ^5.1.0
  firebase_messaging: ^17.0.1

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^5.0.0
  build_runner: ^2.4.15
  riverpod_generator: ^2.6.5
  drift_dev: ^2.25.0

flutter:
  uses-material-design: true

  # Fotos de ejemplo para el catálogo de componentes (solo pruebas).
  assets:
    - assets/demo/
